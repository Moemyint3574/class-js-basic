<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_basics</title>
</head>

<body>
    <h1>JavaScript基礎</h1>
    <p>開発者ツールのConsole（コンソール）を開いて結果を確認してください。</p>
    <script>
        //１行comment//
        /*
        複数行comment
        */
        console.log('js!', 123);
        console.warn('warn');
        console.error('error');
        console.table(['apple', 'orange']);

        let name;
        console.log(name);
        name = 'moemyint';
        console.log(name);

        console.log(6 + 9);
        console.log(10 - 15);
        console.log(3 * 7);
        console.log(10 / 5);
        console.log(7 % 3);
        console.log(3 ** 2);

        let x = 1;
        x = x + 1;
        /*
        x+1だけでは変数の値は変わらない
        thay char = pr ma pr sis yan
        */
        console.log(x);

        x += 100;
        console.log(x);

        x--;
        console.log(x);

        console.log(typeof 'Hello');
        console.log(typeof x);

        console.log('tri' + 'dent');
        console.log(10 + 'dent');
        console.log(x + 'px');

        const person = `JS太郎`;
        const points = 120;
        console.log(`こんにちは、${person}さん。
        点数は${points}です。`);
    </script>
</body>

</html>
